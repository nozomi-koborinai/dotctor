[package]
name = "dotctor"
version = "0.2.0"
edition = "2024"
description = "A CLI tool to diagnose your dotfiles health"
homepage = "https://github.com/nozomi-koborinai/dotctor"
repository = "https://github.com/nozomi-koborinai/dotctor"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Config for 'dist'
[workspace.metadata.dist]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# The Homebrew tap that formulae are published to
tap = "nozomi-koborinai/homebrew-tap"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
